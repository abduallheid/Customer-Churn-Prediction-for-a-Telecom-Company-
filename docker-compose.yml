version: '3.8'

services:
  # FastAPI REST API Service
  api:
    build: .
    container_name: telecom_churn_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
    command: uvicorn telecom_churn.api.app:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Streamlit Interactive Dashboard Service
  ui:
    build: .
    container_name: telecom_churn_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app/src
    command: streamlit run src/telecom_churn/ui/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
